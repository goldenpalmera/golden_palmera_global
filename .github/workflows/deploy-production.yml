
name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full SHA tag of the image verified on staging (sha-<40 hex characters>)"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.validate.outputs.image_tag }}

    steps:
      - name: Validate release image tag
        id: validate
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "::error::Use a full SHA-tagged image, for example sha- followed by 40 lowercase hexadecimal characters."
            exit 1
          fi

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  deploy:
    needs: validate
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.validate.outputs.image_tag }}
      base_url: https://goldenpalmeraglobal.com
      health_url: https://goldenpalmeraglobal.com/api/health
    secrets:
      HOST: ${{ secrets.PRODUCTION_HOST }}
      USER: ${{ secrets.PRODUCTION_USER }}
      SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  rollback:
    name: Roll back after deployment failure
    needs: deploy
    if: failure() && needs.deploy.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Roll back production
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            set -eu
            cd ~/app/docker
            chmod +x rollback.sh
            ./rollback.sh

  notify:
    needs:
      - validate
      - deploy
      - rollback
    if: always()
    uses: ./.github/workflows/notifications.yml
    with:
      status: >-
        ${{ (needs.deploy.result == 'success') && 'success' || 'failure' }}
      environment: Production
      title: Production Deployment
      message: Production deployment workflow finished. Check deployment and rollback logs.
    secrets: inherit
