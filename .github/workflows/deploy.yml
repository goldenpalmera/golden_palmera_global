
name: Deploy Application

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      base_url:
        required: true
        type: string
      health_url:
        required: true
        type: string

    secrets:
      HOST:
        required: true
      USER:
        required: true
      SSH_KEY:
        required: true
      GHCR_USERNAME:
        required: true
      GHCR_TOKEN:
        required: true

permissions:
  contents: read
  packages: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.base_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment inputs
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          BASE_URL: ${{ inputs.base_url }}
          HEALTH_URL: ${{ inputs.health_url }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^sha-[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full SHA tag: sha-<40 lowercase hex characters>"
            exit 1
          fi

          for URL in "$BASE_URL" "$HEALTH_URL"; do
            if [[ ! "$URL" =~ ^https://[^[:space:]]+$ ]]; then
              echo "::error::Deployment URLs must use HTTPS."
              exit 1
            fi
          done

          if [[ "$HEALTH_URL" == "$BASE_URL" ]]; then
            echo "::error::Health URL must be a dedicated health endpoint."
            exit 1
          fi

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Normalize image name
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/$IMAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Verify image exists
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          docker manifest inspect "$IMAGE_NAME:$IMAGE_TAG" > /dev/null

      - name: Verify image signature
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cosign verify "$IMAGE" \
            --certificate-identity-regexp \
            "^https://github\.com/${REPOSITORY}/" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com"

      - name: Verify image provenance
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          cosign verify-attestation "$IMAGE" \
            --type slsaprovenance \
            --certificate-identity-regexp \
            "^https://github\.com/${REPOSITORY}/" \
            --certificate-oidc-issuer \
            "https://token.actions.githubusercontent.com" \
            > /dev/null

      - name: Copy deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker/"
          target: "~/app"

      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          HEALTH_URL: ${{ inputs.health_url }}
          BASE_URL: ${{ inputs.base_url }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,GHCR_USERNAME,GHCR_TOKEN,HEALTH_URL,BASE_URL
          script: |
            set -eu
            cd ~/app/docker

            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" \
              --password-stdin

            chmod +x deploy.sh rollback.sh

            ./deploy.sh \
              "$IMAGE_NAME" \
              "$IMAGE_TAG" \
              "$HEALTH_URL" \
              "$BASE_URL"