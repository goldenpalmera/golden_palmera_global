name: Deploy to Development

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-development
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: development
      image_tag: sha-${{ github.sha }}
      base_url: https://development.goldenpalmeraglobal.com
      health_url: https://development.goldenpalmeraglobal.com/api/health
    secrets:
      HOST: ${{ secrets.DEV_HOST }}
      USER: ${{ secrets.DEV_USER }}
      SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

  notify:
    needs: deploy
    if: always()
    uses: ./.github/workflows/notifications.yml
    with:
      status: ${{ needs.deploy.result }}
      environment: Development
      title: Development Deployment
      message: Development deployment workflow finished.
    secrets: inherit